<!doctype html>
<html lang="mr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>प्रतिनिधी लॉगिन — मेट्रोसिटी पोस्ट</title><link rel="stylesheet" href="styles.css"></head>
<body class="login-page">
<main class="login-card">
  <a class="brand login-brand" href="index.html"><span class="brand-main">मेट्रोसिटी पोस्ट</span><span class="brand-tag">प्रतिनिधी पॅनेल</span></a>
  <h1>प्रतिनिधी लॉगिन</h1><p>बातमी प्रकाशित करण्यासाठी आपल्या खात्यात प्रवेश करा.</p>
  <form onsubmit="demoLogin(event)">
    <label>ई-मेल / वापरकर्ता नाव<input required type="text" placeholder="उदा. reporter"></label>
    <label>पासवर्ड<input required type="password" placeholder="पासवर्ड"></label>
    <button class="primary" type="submit">लॉगिन करा</button>
  </form>
  <small>टीप: हा सध्या डिझाइन/डेमो लॉगिन आहे. पुढील टप्प्यात सुरक्षित authentication जोडू.</small>
</main>
<script src="script.js"></script>
</body>
</html>
