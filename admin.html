<!doctype html>
<html lang="mr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>प्रतिनिधी पॅनेल — मेट्रोसिटी पोस्ट</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="admin-head"><a class="brand" href="index.html"><span class="brand-main">मेट्रोसिटी पोस्ट</span><span class="brand-tag">प्रतिनिधी पॅनेल</span></a><a href="index.html">साईट पहा ↗</a></header>
<main class="admin-wrap">
  <div class="admin-title"><div><span class="eyebrow">न्यूज डेस्क</span><h1>नवीन बातमी</h1></div><button onclick="alert('डेमो: पुढील टप्प्यात डेटा डेटाबेसमध्ये सेव्ह होईल.')">मसुदा जतन करा</button></div>
  <form class="editor">
    <label>मथळा<input placeholder="बातमीचा मुख्य मथळा" required></label>
    <label>उपमथळा<input placeholder="थोडक्यात बातमीचा सारांश"></label>
    <div class="two"><label>विभाग<select><option>शहर</option><option>महाराष्ट्र</option><option>राजकारण</option><option>देश</option><option>क्रीडा</option><option>मनोरंजन</option><option>विशेष</option></select></label><label>प्रतिनिधी<input placeholder="प्रतिनिधीचे नाव"></label></div>
    <label>मुख्य छायाचित्र<input type="file" accept="image/*"></label>
    <label>बातमीचा मजकूर<textarea rows="12" placeholder="मराठीत संपूर्ण बातमी लिहा..."></textarea></label>
    <fieldset><legend>ई-पेपर मांडणी</legend><label class="radio"><input type="radio" name="layout" checked> आपोआप निवडा</label><label class="radio"><input type="radio" name="layout"> फोटो डावीकडे</label><label class="radio"><input type="radio" name="layout"> फोटो उजवीकडे</label><label class="radio"><input type="radio" name="layout"> फोटो वर</label><label class="radio"><input type="radio" name="layout"> फोटो खाली</label><label class="radio"><input type="radio" name="layout"> फोटोशिवाय</label></fieldset>
    <div class="publish-row"><button class="primary" type="button" onclick="alert('डेमो: पुढील टप्प्यात प्रकाशित केल्यावर E-paper आणि blog page आपोआप तयार होईल.')">📰 प्रकाशित करा</button></div>
  </form>
</main>
</body>
</html>
