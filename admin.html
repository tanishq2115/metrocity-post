<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रतिनिधी डॅशबोर्ड | मेट्रोसिटी पोस्ट</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><div class="topline"><span id="current-date"></span><a href="index.html">मुख्यपृष्ठ</a></div><div class="masthead"><a class="brand" href="index.html">मेट्रोसिटी <b>पोस्ट</b></a><span>प्रतिनिधी डॅशबोर्ड</span></div></header>
<main class="article"><section class="normal"><div class="dashboard-head"><div><div class="eyebrow">प्रतिनिधी पॅनेल</div><h1>नवीन बातमी</h1><p>एकदा माहिती भरा; पुढील टप्प्यात याच डेटावरून ई-पेपर आणि बातमी पेज तयार केले जाईल.</p></div><button class="ghost" onclick="logout()">लॉगआउट</button></div>
<form id="newsForm" class="news-form">
<label>विभाग<select id="category"><option>महाराष्ट्र</option><option>स्थानिक</option><option>राजकारण</option><option>समाज</option><option>शिक्षण</option><option>आरोग्य</option><option>क्रीडा</option><option>मनोरंजन</option><option>व्यवसाय</option></select></label>
<label>ठिकाण<input id="location" placeholder="उदा. छत्रपती संभाजीनगर"></label>
<label>मुख्य मथळा<input id="headline" required placeholder="बातमीचा मथळा"></label>
<label>उपमथळा<input id="subheadline" placeholder="थोडक्यात माहिती"></label>
<label>रिपोर्टरचे नाव<input id="reporter" placeholder="रिपोर्टरचे नाव"></label>
<label>मुख्य फोटो<input id="photo" type="file" accept="image/*"></label>
<label>संपूर्ण बातमी<textarea id="content" required rows="14" placeholder="मराठीत संपूर्ण बातमी लिहा..."></textarea></label>
<fieldset><legend>ई-पेपर मांडणी</legend><label class="radio"><input type="radio" name="layout" value="auto" checked> आपोआप निवडा</label><label class="radio"><input type="radio" name="layout" value="left"> फोटो डावीकडे</label><label class="radio"><input type="radio" name="layout" value="right"> फोटो उजवीकडे</label><label class="radio"><input type="radio" name="layout" value="top"> फोटो वर</label><label class="radio"><input type="radio" name="layout" value="bottom"> फोटो खाली</label><label class="radio"><input type="radio" name="layout" value="none"> फोटोशिवाय</label></fieldset>
<div class="form-actions"><button type="button" class="ghost" onclick="saveDraft()">मसुदा जतन करा</button><button class="share button" type="submit">📰 प्रकाशित करा</button></div></form>
<div id="status" class="status" hidden></div><div class="drafts"><h2>माझे मसुदे</h2><div id="draftList">मसुदे उपलब्ध नाहीत.</div></div>
</section></main><script src="script.js"></script><script>if(localStorage.getItem('metrocity_logged_in')!=='1') location.href='login.html'; initDate(); initAdmin();</script></body></html>
